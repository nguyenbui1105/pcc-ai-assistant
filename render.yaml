services:
  - type: web
    name: pcc-assistant
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: chainlit run ui/app.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false   # set manually in Render dashboard
      - key: PCC_BASE_URL
        value: https://www.pcc.edu
      - key: LOG_LEVEL
        value: INFO
