# ── Deployment Notes ──────────────────────────────────────────────────────────
# Free tier: personal data features (MyPCC, GRAD Plan) will NOT work because:
#   1. Playwright requires browser binaries not available on Render free tier.
#   2. Cookie files (data/*.json) are gitignored and won't be present on server.
# The app will run in demo mode only on free tier.
#
# To enable personal data on a server:
#   - Use a paid tier with a persistent disk and mount data/ there.
#   - Or self-host with Docker (playwright install already runs in the image).
# ─────────────────────────────────────────────────────────────────────────────

services:
  - type: web
    name: pcc-assistant
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && playwright install chromium --with-deps
    startCommand: chainlit run ui/app.py --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_API_KEY
        sync: false   # set manually in Render dashboard
      - key: PCC_BASE_URL
        value: https://www.pcc.edu
      - key: LOG_LEVEL
        value: INFO
